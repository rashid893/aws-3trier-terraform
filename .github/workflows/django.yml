name: Django CI

on:
  push:
    branches: [main]
    paths:
      - 'django-app/**'
      - '.github/workflows/django.yml'
  pull_request:
    branches: [main]
    paths:
      - 'django-app/**'
      - '.github/workflows/django.yml'

env:
  PYTHON_VERSION: "3.11"

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: django-app

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testpassword
          MYSQL_DATABASE: testdb
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: django-app/requirements.txt

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config default-libmysqlclient-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 bandit safety

      - name: Flake8 Lint
        run: flake8 . --max-line-length=120 --exclude=migrations,venv

      - name: Django Check
        env:
          DJANGO_SETTINGS_MODULE: config.settings
          DB_NAME: testdb
          DB_USER: root
          DB_PASSWORD: testpassword
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
        run: python manage.py check --deploy 2>&1 || true

      - name: Run Migrations
        env:
          DB_NAME: testdb
          DB_USER: root
          DB_PASSWORD: testpassword
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
        run: python manage.py migrate

      - name: Run Tests
        env:
          DB_NAME: testdb
          DB_USER: root
          DB_PASSWORD: testpassword
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
        run: python manage.py test --verbosity=2

      - name: Security Scan (Bandit)
        run: bandit -r . -x ./venv,./migrations --severity-level medium || true

      - name: Dependency Vulnerability Check
        run: safety check -r requirements.txt || true
